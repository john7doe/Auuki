name: CI

# Validates that pull requests build, without deploying. No Azure
# credentials or OIDC are required and no preview environment is created.
on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    # The date tests in test/utils.test.js assume the author's local timezone.
    env:
      TZ: Europe/Helsinki
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Install API dependencies
        run: npm install --prefix api
      - name: Test (passing suites)
        run: npm run test:ci
